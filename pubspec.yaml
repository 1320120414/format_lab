name: format_lab
description: "本地离线的图片与视频格式转换工具"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  audio_session: ^0.1.25
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  file_picker: ^13.1.0
  ffmpeg_kit_flutter_new: ^4.6.7
  image: ^4.5.0
  just_audio: ^0.9.40
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  video_player: ^2.9.0
  liquid_glass_widgets: ^1.15.0
  video_player_win: ^3.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 29
